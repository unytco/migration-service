name: CI

on:
  push:
    branches: [develop, develop-0.7, main, main-0.6]
  pull_request:
    branches: [develop, develop-0.7, main, main-0.6]

# One run per branch under test: `head_ref` is the PR's source branch, `ref` the
# pushed branch (push only fires on the base branches, so the two never collide).
# Superseded runs are cancelled — on main that just means the newest commit's CI
# is the one deploy.yml gates on.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    name: notary-daemon (Rust)
    runs-on: ubuntu-latest
    # `ham` (git dep) and `rave_engine` (crates.io) are both public — cargo fetches
    # them anonymously, no token or git-auth config needed.
    defaults:
      run:
        working-directory: notary-daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: notary-daemon
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test

  agent:
    name: headless-migrator (Rust)
    runs-on: ubuntu-latest
    # Same public deps as the daemon (`ham` git + `rave_engine` crates.io) —
    # fetched anonymously, no token needed.
    defaults:
      run:
        working-directory: headless-migrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: headless-migrator
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test

  router:
    name: router (Cloudflare Worker, TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: migration-router
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: migration-router/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

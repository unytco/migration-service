name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

jobs:
  daemon:
    name: notary-daemon (Rust)
    runs-on: ubuntu-latest
    # `ham` (git dep) and `rave_engine` (crates.io) are both public — cargo fetches
    # them anonymously, no token or git-auth config needed.
    defaults:
      run:
        working-directory: notary-daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: notary-daemon
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test

  router:
    name: router (Cloudflare Worker, TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: router/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

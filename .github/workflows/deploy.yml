name: Deploy router

# Deploys the Cloudflare Worker router AFTER the CI workflow succeeds on main.
# Gated on CI's success (workflow_run) rather than re-running typecheck/test here,
# so the checks run once. The notary daemon is NOT deployed here — it ships to
# HEART droplets via unyt's automation hub.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, main-0.6]

jobs:
  deploy-router:
    name: wrangler deploy (router)
    runs-on: ubuntu-latest
    # Only deploy when the CI run that triggered this actually passed.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: migration-router
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Deploy exactly the commit CI validated, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha }}
      # Deliberately UNCACHED. `cache: npm` would key this secrets-bearing job's
      # ~/.npm on the same lockfile hash as ci.yml's `router` job, letting a less
      # privileged run seed the cache a Cloudflare-credentialed `npm ci` then
      # reads (zizmor: cache-poisoning). A cold `npm ci` here costs seconds.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: npm ci
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: migration-router
        # Runtime Worker secrets (MIGRATION_NOTARY_BEARER_TOKEN,
        # CF_ACCESS_CLIENT_ID/SECRET) are set once via `wrangler secret put`,
        # independent of this deploy token.

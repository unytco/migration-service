name: Deploy router

# Auto-deploys the Cloudflare Worker router on push to main. The notary daemon is
# NOT deployed here — it ships to HEART droplets via the workshop automation hub.

on:
  push:
    branches: [main]

jobs:
  deploy-router:
    name: wrangler deploy (router)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: router/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: router
        # Runtime Worker secrets (MIGRATION_NOTARY_BEARER_TOKEN,
        # CF_ACCESS_CLIENT_ID/SECRET) are set once via `wrangler secret put`,
        # independent of this deploy token.

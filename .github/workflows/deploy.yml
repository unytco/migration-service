name: Deploy router

# Deploys the Cloudflare Worker router AFTER the CI workflow succeeds on main.
# Gated on CI's success (workflow_run) rather than re-running typecheck/test here,
# so the checks run once. The notary daemon is NOT deployed here — it ships to
# HEART droplets via unyt's automation hub.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy-router:
    name: wrangler deploy (router)
    runs-on: ubuntu-latest
    # Only deploy when the CI run that triggered this actually passed.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: migration-router
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Deploy exactly the commit CI validated, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: migration-router/package-lock.json
      - run: npm ci
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: migration-router
        # Runtime Worker secrets (MIGRATION_NOTARY_BEARER_TOKEN,
        # CF_ACCESS_CLIENT_ID/SECRET) are set once via `wrangler secret put`,
        # independent of this deploy token.

name: Deploy router

# Deploys the Cloudflare Worker router AFTER the CI workflow succeeds on main.
# Gated on CI's success (workflow_run) rather than re-running typecheck/test here,
# so the checks run once. The notary daemon is NOT deployed here — it ships to
# HEART droplets via the workshop automation hub.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy-router:
    name: wrangler deploy (router)
    runs-on: ubuntu-latest
    # Only deploy when the CI run that triggered this actually passed.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: router
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI validated, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: router/package-lock.json
      - run: npm ci
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: router
        # Runtime Worker secrets (MIGRATION_NOTARY_BEARER_TOKEN,
        # CF_ACCESS_CLIENT_ID/SECRET) are set once via `wrangler secret put`,
        # independent of this deploy token.

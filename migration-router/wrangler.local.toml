# The local-testnet router, never deployed.
#
#   npm run dev:local        # wrangler dev -c wrangler.local.toml, serves :8787
#
# Runtime env comes from .dev.vars (gitignored, seeded from .dev.vars.example by dev:local),
# which overrides [vars].

name = "migration-router-local"
main = "src/index.local.ts"
compatibility_date = "2024-12-30"

[vars]
GITHUB_RELEASES_URL = "https://api.github.com/repos/unytco/unyt-sandbox/releases"

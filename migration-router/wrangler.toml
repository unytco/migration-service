# The TestNet router.
#
# Runtime secrets, set with `wrangler secret put`:
#   MIGRATION_NOTARY_BEARER_TOKEN   bearer token shared with every notary daemon
#   CF_ACCESS_CLIENT_ID             Cloudflare Access service-token id
#   CF_ACCESS_CLIENT_SECRET         Cloudflare Access service-token secret

name = "migration-router"
main = "src/index.ts"
compatibility_date = "2024-12-30"

[vars]
GITHUB_RELEASES_URL = "https://api.github.com/repos/unytco/unyt-sandbox/releases"

[observability]
enabled = true

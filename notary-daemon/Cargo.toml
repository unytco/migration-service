[package]
name = "migration-notary"
version = "0.3.0"
edition = "2021"
description = "Notary daemon for unyt DNA migration: attests an agent's closed chain from the notary's own conductor, for the migration-service to combine into the package that agent opens its successor with"
license = "CAL-1.0"

[lib]
name = "migration_notary"
path = "src/lib.rs"

[[bin]]
name = "migration-notary"
path = "src/main.rs"

[dependencies]
# HTTP
axum = "0.7"
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async trait (Conductor abstraction for mockable zome calls)
async-trait = "0.1"

# Utilities
anyhow = "1"
# Already in the graph via lair (the same 2.x entry), so declaring it adds no
# build: it parses the lair connection URL at startup, where a bad one is fatal.
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

ham = { git = "https://github.com/unytco/ham.git", rev = "fbb4b6eb8a79a507e9453b709ed00f15c5618fb4" }
# EXACT `=` pins at the app's versions: a caret would resolve ahead of the
# deployed DNA, breaking notary-signature / init_properties byte parity.
holochain_client = "=0.9.1"
holo_hash = { version = "=0.7.1", features = ["encoding"] }
# Only the tests name it: the exact pin holds rave_engine's hdi at the DNA's version.
hdi = "=0.8.1"

# The wire-type crate the byte-parity rule above is about, so the `=` must never become a caret.
rave_engine = "=0.14.0"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Real-HTTP client for the gated live round-trip test only.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
strip = "symbols"

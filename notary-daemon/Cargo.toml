[package]
name = "migration-notary"
version = "0.2.0"
edition = "2021"
description = "Notary daemon for unyt DNA migration: attests an agent's closed chain from the notary's own conductor, for the migration-service to combine into the package that agent opens its successor with"
license = "CAL-1.0"

[lib]
name = "migration_notary"
path = "src/lib.rs"

[[bin]]
name = "migration-notary"
path = "src/main.rs"

[dependencies]
# HTTP
axum = "0.7"
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async trait (Conductor abstraction for mockable zome calls)
async-trait = "0.1"

# Utilities
anyhow = "1"
# Already in the graph via lair (the same 2.x entry), so declaring it adds no
# build: it parses the lair connection URL at startup, where a bad one is fatal.
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Holochain bridge — same stack as pricing_oracle / watchtower-observer.
# EXACT `=` pins on the 0.7 line: the app/DNA pin `=0.9.0` (src-tauri), and a
# caret would resolve *ahead* of the deployed DNA — breaking notary-signature /
# init_properties byte parity.
ham = { git = "https://github.com/unytco/ham.git", rev = "73b4bdeec025f4697df9fb7064aa8538495e520b" }
holochain_client = "=0.9.0"
holo_hash = { version = "=0.7.0", features = ["encoding"] }
# Same hdi the unyt workspace pins (rave_engine uses hdi 0.8.0) so Signature /
# Timestamp / hash types are identical to the ones in the zome-call payloads.
hdi = "=0.8.0"

# The wire-type crate the byte-parity rule above is about, so the `=` must never become a caret.
rave_engine = "=0.13.0"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Real-HTTP client for the gated live round-trip test only.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
strip = "symbols"

[package]
name = "migration-notary"
version = "0.1.0"
edition = "2021"
description = "Notary daemon for unyt DNA migration — serves an agent's committed closing summary from the notary's own conductor so the migration-service can hand it to that agent for opening on the successor DNA; read-only, no signing capability"
license = "CAL-1.0"

[lib]
name = "migration_notary"
path = "src/lib.rs"

[[bin]]
name = "migration-notary"
path = "src/main.rs"

[dependencies]
# HTTP
axum = "0.7"
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async trait (Conductor abstraction for mockable zome calls)
async-trait = "0.1"

# Utilities
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

# Holochain bridge — same stack as pricing_oracle / watchtower-observer
ham = { git = "https://github.com/unytco/ham.git", branch = "main" }
holochain_client = "0.8.1"
holo_hash = { version = "0.6.1", features = ["encoding"] }
# Same hdi the unyt workspace pins (rave_engine uses hdi 0.7.1) so Signature /
# Timestamp / hash types are identical to the ones in the zome-call payloads.
hdi = "0.7.1"

# Shared migration protocol types (ReadCloseResponse / NotarySignature /
# SummaryStatePayload / SummaryState).
rave_engine = "0.4.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Real-HTTP client for the gated live round-trip test only.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
